<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>첨탑을 오르는 자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Song+Myung&display=swap">
<style>
/* Layout: dark tower-stone shell with a fixed status bar; the map is an inked parchment scroll, combat is a candlelit floor with the hand fanned along the bottom edge */
:root {
  --stone: #141a1d;
  --stone-2: #1d2629;
  --stone-3: #2b3639;
  --line: #3e4c4f;
  --text: #ece4d2;
  --muted: #9aa6a2;
  --candle: #e8b65a;
  --blood: #cf4b3c;
  --ward: #5fa8c4;
  --venom: #a77bd6;
  --moss: #79b36a;
  --parch: #d8c69d;
  --parch-2: #c2ad7f;
  --ink: #3b2a19;
  --c-attack: #8f3029;
  --c-skill: #2c5d6a;
  --c-power: #8b6a22;
  --c-status: #4a4f52;
  --c-curse: #3a2440;
  --shadow: rgba(0, 0, 0, 0.55);
  --font-title: "Song Myung", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-num: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --cw: clamp(78px, 17vw, 132px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--stone); color: var(--text); font-family: var(--font-body); font-size: 15px; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font-family: var(--font-body); color: inherit; cursor: pointer; }
button:focus-visible, .card:focus-visible, .unit:focus-visible, .node:focus-visible { outline: 3px solid var(--candle); outline-offset: 3px; }
b { color: var(--candle); font-weight: 400; }
#root { height: 100%; display: flex; flex-direction: column; }

/* status bar */
#bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: linear-gradient(var(--stone-2), var(--stone)); border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
#bar .who { font-family: var(--font-title); font-size: 18px; letter-spacing: 0.02em; }
#bar .stat { display: flex; align-items: center; gap: 5px; font-family: var(--font-num); font-size: 17px; }
#bar .stat svg { width: 18px; height: 18px; }
#bar .hp { color: var(--blood); }
#bar .gold { color: var(--candle); }
#bar .floor { color: var(--muted); }
#relics { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 56px; }
.relic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #f6d891, var(--candle) 45%, #8a6424); color: var(--ink); font-family: var(--font-title); font-size: 15px; border: 2px solid #5e4418; box-shadow: 0 2px 4px var(--shadow); padding: 0; }
.relic.big { width: 54px; height: 54px; font-size: 26px; }
.btn { background: var(--stone-3); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; font-size: 15px; transition: background .15s, transform .1s; }
.btn:hover { background: #3a484b; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--candle); color: var(--ink); border-color: #9c7428; font-family: var(--font-num); font-size: 17px; letter-spacing: 0.02em; }
.btn.primary:hover { background: #f2c873; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

#screen { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.pad { height: 100%; overflow-y: auto; padding: 24px 16px 40px; }
.center { display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 760px; margin: 0 auto; text-align: center; }
h1, h2 { font-family: var(--font-title); font-weight: 400; text-wrap: balance; margin: 0; }
h2 { font-size: 30px; }
.lead { color: var(--muted); max-width: 52ch; line-height: 1.6; margin: 0; }

/* title */
#title { height: 100%; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(ellipse at 50% 100%, #3a2b18 0%, transparent 60%), var(--stone); overflow-y: auto; }
#title h1 { font-size: clamp(44px, 11vw, 92px); line-height: 1.05; color: var(--text); text-shadow: 0 4px 0 #000, 0 0 40px rgba(232, 182, 90, .25); }
#title .sub { font-family: var(--font-num); color: var(--candle); letter-spacing: 0.3em; font-size: 13px; }
.spire-art { width: min(240px, 60vw); height: auto; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px 22px; text-align: left; color: var(--muted); font-size: 14px; line-height: 1.55; max-width: 640px; width: 100%; }
.how div b { display: block; font-family: var(--font-num); font-size: 15px; letter-spacing: .04em; }

/* map */
#map { height: 100%; overflow-y: auto; padding: 18px 16px 40px; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.5)), var(--stone); }
.scroll { max-width: 620px; margin: 0 auto; background: linear-gradient(90deg, var(--parch-2), var(--parch) 8%, var(--parch) 92%, var(--parch-2)); color: var(--ink); border-radius: 4px; box-shadow: 0 10px 30px var(--shadow), inset 0 0 60px rgba(90, 60, 20, .35); padding: 18px 10px 24px; position: relative; }
.scroll h2 { color: var(--ink); text-align: center; font-size: 24px; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 13px; margin: 6px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-grid; place-items: center; font-family: var(--font-title); font-size: 12px; }
#mapsvg { width: 100%; height: auto; display: block; }
#mapsvg .edge { stroke: var(--ink); stroke-opacity: .35; stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; fill: none; }
#mapsvg .edge.done { stroke-opacity: .9; stroke-dasharray: none; stroke-width: 3; }
#mapsvg .node circle { fill: var(--parch); stroke: var(--ink); stroke-width: 2; }
#mapsvg .node text { font-family: var(--font-title); font-size: 15px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#mapsvg .node.visited circle { fill: var(--ink); }
#mapsvg .node.visited text { fill: var(--parch); }
#mapsvg .node.avail { cursor: pointer; }
#mapsvg .node.avail circle { stroke: #9c2b1f; stroke-width: 3; animation: pulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
#mapsvg .node.avail:hover circle { fill: #f3e4bd; }
#mapsvg .node.dim { opacity: .55; }
#mapsvg .node.E text { fill: #8a1f14; }
#mapsvg .node.visited.E text { fill: #f0b3a8; }
@keyframes pulse { 50% { transform: scale(1.18); } }

/* combat */
#combat { height: 100%; display: grid; grid-template-rows: 1fr auto; background:
  radial-gradient(ellipse 60% 40% at 50% 92%, rgba(232, 182, 90, .14), transparent 70%),
  linear-gradient(180deg, #0f1517 0%, #1b2427 55%, #232b26 56%, #141917 100%); }
.field { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 12px clamp(16px, 5vw, 80px) 2vh; min-height: 0; }
.enemies { display: flex; align-items: flex-end; justify-content: flex-end; gap: clamp(4px, 2vw, 22px); flex-wrap: wrap; flex: 1; min-width: 0; }
.unit { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; width: clamp(92px, 16vw, 210px); transition: opacity .5s, transform .2s; }
.unit .sprite { width: 100%; aspect-ratio: 1; max-width: 100%; position: relative; animation: bob 3.2s ease-in-out infinite; }
.unit .sprite svg { width: 100%; height: 100%; overflow: visible; }
.unit .sprite::after { content: ""; position: absolute; left: 15%; right: 15%; bottom: -2%; height: 10%; background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%); z-index: -1; }
.unit.player .sprite { animation-duration: 4s; }
.unit.small { width: clamp(70px, 11vw, 150px); }
.unit.large { width: clamp(120px, 22vw, 290px); }
@keyframes bob { 50% { transform: translateY(-3%); } }
.unit.hit .sprite { animation: shake .35s; }
.unit.hit .sprite svg { animation: flash .35s; }
@keyframes shake { 20% { transform: translateX(-6%); } 50% { transform: translateX(5%); } 80% { transform: translateX(-2%); } }
@keyframes flash { 30% { filter: brightness(2.2) saturate(.3); } }
.unit.lunge .sprite { animation: lunge .35s; }
@keyframes lunge { 40% { transform: translateX(-14%) scale(1.05); } }
.unit.player.lunge .sprite { animation-name: lungeR; }
@keyframes lungeR { 40% { transform: translateX(14%) scale(1.05); } }
.unit.dead { opacity: 0; pointer-events: none; transform: translateY(10px); }
.unit.gone { display: none; }
.enemy.targetable { cursor: crosshair; }
.enemy.targetable .sprite { filter: drop-shadow(0 0 10px rgba(232, 182, 90, .7)); }
.enemy.targetable:hover .sprite { filter: drop-shadow(0 0 14px var(--candle)) brightness(1.1); }
.hpbar { position: relative; width: 92%; height: 15px; background: #2a1312; border: 1px solid #000; border-radius: 8px; overflow: visible; }
.hpbar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#e0614e, #a3291d); border-radius: 7px; transition: width .3s; }
.hpbar.blocked > i { background: linear-gradient(#83c3da, #3e7e98); }
.hpbar > span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-num); font-size: 12px; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.blk { position: absolute; left: -14px; top: 50%; transform: translateY(-50%); width: 26px; height: 28px; display: grid; place-items: center; font-family: var(--font-num); font-size: 13px; color: #fff; background: var(--ward); clip-path: polygon(50% 0, 100% 15%, 92% 70%, 50% 100%, 8% 70%, 0 15%); text-shadow: 0 1px 1px #000; }
.uname { font-family: var(--font-title); font-size: 14px; color: var(--text); text-shadow: 0 1px 2px #000; white-space: nowrap; }
.sts { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; min-height: 20px; }
.st { font-size: 11px; padding: 1px 5px; border-radius: 3px; background: rgba(0,0,0,.55); border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; cursor: help; }
.st.good { color: var(--moss); border-color: #3f5f37; }
.st.bad { color: #d59cf0; border-color: #553a6b; }
.intent { display: flex; align-items: center; gap: 3px; font-family: var(--font-num); font-size: 17px; min-height: 30px; text-shadow: 0 1px 2px #000; cursor: help; animation: bob 1.6s ease-in-out infinite; }
.intent svg { width: 26px; height: 26px; }
.intent.atk { color: #ff8f7f; }
.float { position: fixed; z-index: 50; pointer-events: none; font-family: var(--font-num); font-size: 30px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 8px #000; animation: rise 0.9s ease-out forwards; transform: translate(-50%, -50%); }
.float.blockf { color: #a7dcf0; font-size: 22px; }
.float.heal { color: #9be08a; }
.float.small { font-size: 18px; color: #e5d1ff; }
@keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -60px; } }

.dock { display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 8px; padding: 0 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
.dock .left, .dock .right { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 4px; }
.orb { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-size: 24px; color: #2a1708; background: radial-gradient(circle at 35% 30%, #ffe6a8, var(--candle) 50%, #a9701e); border: 3px solid #4b2d0e; box-shadow: 0 0 20px rgba(232, 182, 90, .5); font-variant-numeric: tabular-nums; }
.orb.empty { filter: grayscale(.85) brightness(.6); box-shadow: none; }
.pile { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.pile b { font-family: var(--font-num); font-size: 16px; color: var(--text); }
.endturn { min-width: 98px; }
.hand { display: flex; justify-content: center; align-items: flex-end; height: calc(var(--cw) * 1.45); padding-top: 10px; min-width: 0; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); top: 10px; font-size: 14px; color: var(--candle); background: rgba(0,0,0,.6); padding: 4px 12px; border-radius: 12px; pointer-events: none; white-space: nowrap; z-index: 5; }

/* cards */
.card { --tc: var(--c-attack); position: relative; flex: none; width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .07); background: linear-gradient(170deg, color-mix(in srgb, var(--tc) 85%, #fff 15%), var(--tc) 40%, color-mix(in srgb, var(--tc) 60%, #000)); border: 2px solid #0b0b0b; box-shadow: 0 6px 14px var(--shadow), inset 0 0 0 2px rgba(255,255,255,.12); padding: calc(var(--cw) * .05); display: flex; flex-direction: column; align-items: center; font-size: calc(var(--cw) * .086); line-height: 1.3; color: #f6eedd; cursor: pointer; transition: transform .14s ease-out, box-shadow .14s; text-align: center; }
.card.skill { --tc: var(--c-skill); }
.card.power { --tc: var(--c-power); }
.card.status { --tc: var(--c-status); }
.card.curse { --tc: var(--c-curse); }
.card .cname { font-family: var(--font-title); font-size: 1.22em; padding: .1em .5em; margin-top: .25em; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(0,0,0,.35); border-radius: 3px; border-bottom: 2px solid #8e9493; }
.card.r-uncommon .cname { border-bottom-color: var(--ward); }
.card.r-rare .cname { border-bottom-color: var(--candle); }
.card.up .cname { color: #a8f08f; }
.card .art { width: 86%; flex: 1; margin: .3em 0 .15em; border-radius: 3px; border: 1px solid rgba(0,0,0,.6); background: radial-gradient(circle at 50% 60%, rgba(255,255,255,.18), transparent 60%), linear-gradient(160deg, rgba(0,0,0,.1), rgba(0,0,0,.55)); display: grid; place-items: center; overflow: hidden; }
.card .art svg { width: 58%; height: 80%; opacity: .9; }
.card .ctype { font-size: .8em; color: rgba(255,255,255,.7); letter-spacing: .1em; }
.card .cdesc { height: 3.95em; width: 100%; display: grid; place-items: center; font-size: .95em; background: rgba(0,0,0,.3); border-radius: 3px; padding: .15em .25em; overflow: hidden; }
.card .cdesc b { color: var(--candle); }
.card .num { font-family: var(--font-num); }
.card .num.plus { color: #9fe58b; }
.card .num.minus { color: #ff9b8b; }
.card .cost { position: absolute; left: calc(var(--cw) * -.08); top: calc(var(--cw) * -.08); width: calc(var(--cw) * .27); height: calc(var(--cw) * .27); border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-size: 1.6em; color: #2a1708; background: radial-gradient(circle at 35% 30%, #ffe6a8, var(--candle) 55%, #a9701e); border: 2px solid #3a2208; z-index: 2; }
.card .cost.cheaper { color: #1f6b14; }
.hand .card { transform-origin: 50% 130%; }
.hand .card.cant .cost { filter: grayscale(1) brightness(.7); }
.hand .card.cant { filter: brightness(.82); }
.hand .card:hover, .hand .card.sel { z-index: 20; }
.hand .card.sel { box-shadow: 0 0 0 3px var(--candle), 0 0 26px rgba(232,182,90,.8); }
.ghost { position: fixed; z-index: 60; pointer-events: none; animation: flyaway .45s ease-in forwards; }
@keyframes flyaway { to { transform: translate(var(--dx), var(--dy)) scale(.5) rotate(8deg); opacity: 0; } }

.act2 #combat, #combat.act2 { background:
  radial-gradient(ellipse 60% 40% at 50% 92%, rgba(214, 160, 90, .16), transparent 70%),
  linear-gradient(180deg, #1a1416 0%, #2a2124 55%, #3a2c22 56%, #1c1512 100%); }
#pots { display: flex; gap: 4px; }
.pot { width: 30px; height: 30px; padding: 0; border-radius: 6px; background: rgba(0,0,0,.35); border: 1px dashed var(--line); display: grid; place-items: center; }
.pot svg { width: 24px; height: 24px; }
button.pot { border-style: solid; }
button.pot:hover { background: var(--stone-3); }
.pot.big { width: 46px; height: 46px; }
.pot.big svg { width: 38px; height: 38px; }
#potmenu { position: fixed; z-index: 45; width: min(240px, calc(100vw - 32px)); background: var(--stone-2); border: 1px solid var(--candle); border-radius: 8px; padding: 12px; box-shadow: 0 10px 30px var(--shadow); display: flex; flex-direction: column; gap: 8px; }
#potmenu .t { font-family: var(--font-title); font-size: 18px; }
#potmenu p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
#potmenu .row { display: flex; gap: 8px; }
#potmenu .row .btn { flex: 1; padding: 6px 10px; }

/* reward / rest / shop / event */
.choices { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
.choices .card { --cw: clamp(110px, 28vw, 150px); }
.choices .card:hover { transform: translateY(-6px) scale(1.04); }
.rewardlist { display: flex; flex-direction: column; gap: 8px; width: min(380px, 100%); }
.reward { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 14px; border-radius: 6px; background: var(--stone-2); border: 1px solid var(--line); font-size: 16px; }
.reward:hover { background: var(--stone-3); }
.reward svg, .reward .relic { width: 28px; height: 28px; flex: none; }
.reward small { display: block; color: var(--muted); font-size: 13px; }
.opts { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
.opt { width: min(240px, 100%); padding: 18px; border-radius: 8px; background: var(--stone-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
.opt:hover:not(:disabled) { background: var(--stone-3); border-color: var(--candle); }
.opt .t { font-family: var(--font-title); font-size: 22px; }
.opt small { color: var(--muted); font-size: 14px; line-height: 1.5; }
.opt svg { width: 46px; height: 46px; }
.evt { max-width: 620px; text-align: left; display: flex; flex-direction: column; gap: 14px; }
.evt p { line-height: 1.75; margin: 0; color: #d9d0bd; }
.evt .eopt { text-align: left; padding: 12px 16px; border-radius: 6px; background: var(--stone-2); border: 1px solid var(--line); font-size: 16px; }
.evt .eopt:hover { border-color: var(--candle); }
.evt .eopt small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.shopgrid { display: flex; flex-wrap: wrap; gap: 16px 18px; justify-content: center; }
.ware { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; }
.ware .card { --cw: clamp(96px, 24vw, 128px); }
.ware:hover:not(:disabled) .card { transform: translateY(-4px); }
.price { font-family: var(--font-num); color: var(--candle); font-size: 16px; display: flex; align-items: center; gap: 4px; }
.price.no { color: var(--blood); }
.ware:disabled { opacity: .45; cursor: not-allowed; }
.shoprow { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.relicoffer { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 14px; background: var(--stone-2); border: 1px solid var(--line); border-radius: 8px; max-width: 320px; }
.relicoffer small { display: block; color: var(--muted); font-size: 13px; }

/* overlay */
#overlay { position: fixed; inset: 0; z-index: 40; background: rgba(6, 9, 10, .9); display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); gap: 12px; }
#overlay header { display: flex; align-items: center; gap: 12px; justify-content: space-between; max-width: 1000px; width: 100%; margin: 0 auto; }
#overlay h2 { font-size: 24px; }
#ovgrid { flex: 1; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 18px 14px; justify-content: center; align-content: flex-start; padding: 12px 4px; max-width: 1000px; width: 100%; margin: 0 auto; }
#ovgrid .card { --cw: clamp(96px, 26vw, 128px); }
#ovgrid.pickable .card:hover { transform: translateY(-5px); box-shadow: 0 0 0 3px var(--candle); }
#ovfoot { display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; }
.compare { display: flex; align-items: center; gap: 16px; }
.compare .card { --cw: clamp(110px, 30vw, 150px); }
.compare .arrow { font-family: var(--font-num); font-size: 28px; color: var(--candle); }

#toast { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); z-index: 70; background: rgba(0,0,0,.82); border: 1px solid var(--line); color: var(--text); padding: 10px 18px; border-radius: 8px; font-size: 16px; pointer-events: none; opacity: 0; transition: opacity .25s; max-width: calc(100vw - 32px); text-align: center; line-height: 1.5; }
#toast.show { opacity: 1; }
#banner { position: fixed; left: 0; right: 0; top: 40%; z-index: 30; text-align: center; font-family: var(--font-title); font-size: clamp(30px, 7vw, 56px); padding: 10px 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,.75) 25%, rgba(0,0,0,.75) 75%, transparent); pointer-events: none; animation: banner 1.1s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scaleY(.3); } 20%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }

.end { color: var(--muted); }
.end dl { display: grid; grid-template-columns: auto auto; gap: 6px 22px; margin: 0; font-variant-numeric: tabular-nums; }
.end dt { text-align: right; }
.end dd { margin: 0; text-align: left; color: var(--text); font-family: var(--font-num); }

@media (max-width: 560px) {
  body { font-size: 14px; }
  #bar { gap: 10px; padding-inline: 12px; }
  #bar .who { display: none; }
  .relic { width: 24px; height: 24px; font-size: 12px; }
  .pot { width: 26px; height: 26px; }
  .pot svg { width: 20px; height: 20px; }
  #bar .stat { font-size: 15px; }
  .field { padding-inline: 8px; }
  .unit { width: clamp(76px, 25vw, 110px); }
  .unit.player { width: 82px; }
  .unit.small { width: 66px; }
  .unit.large { width: 120px; }
  .uname { font-size: 12px; }
  .intent { font-size: 14px; }
  .intent svg { width: 20px; height: 20px; }
  .orb { width: 48px; height: 48px; font-size: 19px; }
  .dock { padding-inline: 6px; gap: 4px; }
  .endturn { min-width: 0; padding: 8px 12px; font-size: 15px !important; }
  .dock { grid-template-columns: 1fr 1fr; row-gap: 0; }
  .dock .left, .dock .right { flex-direction: row; padding-bottom: 0; }
  .dock .left { justify-content: flex-start; }
  .dock .right { justify-content: flex-end; flex-direction: row-reverse; }
  .hand { grid-column: 1 / -1; grid-row: 2; padding-top: 14px; }
  .pile { padding: 3px 5px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .float { animation: rise .9s linear forwards !important; }
}
</style>
</head>
<body>
<div id="root">
  <header id="bar" hidden></header>
  <main id="screen"></main>
</div>
<div id="overlay" hidden role="dialog" aria-modal="true">
  <header><h2 id="ovtitle"></h2><button class="btn" id="ovclose">닫기</button></header>
  <div id="ovgrid"></div>
  <div id="ovfoot"></div>
</div>
<div id="potmenu" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const rint = (a, b) => a + rnd(b - a + 1);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, reduced ? ms * 0.35 : ms));
let uidN = 1;
const mk = (id, up = false) => ({ id, up, uid: uidN++ });

let toastT;
function toast(msg) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }
function banner(text) { const b = document.createElement('div'); b.id = 'banner'; b.textContent = text; document.body.appendChild(b); setTimeout(() => b.remove(), 1200); }

/* ---------- icons ---------- */
const IC = {
  heart: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-8-5.3-8-11.2C4 6.6 6.4 4.5 9 4.5c1.4 0 2.4.6 3 1.6.6-1 1.6-1.6 3-1.6 2.6 0 5 2.1 5 5.3C20 15.7 12 21 12 21z"/></svg>',
  coin: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/><circle cx="12" cy="12" r="6" fill="none" stroke="#5e4418" stroke-width="1.6"/></svg>',
  tower: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 22V9l-2-2V3h3v2h2V3h2v2h2V3h3v4l-2 2v13z"/></svg>',
  deck: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="12" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="8" y="6" width="12" height="16" rx="2" fill="currentColor"/></svg>',
  sword: '<svg viewBox="0 0 32 32"><path fill="#ff8f7f" stroke="#2a0d09" stroke-width="1.5" d="M26 3l3 3-14 14-3-3zM9 16l7 7-2 2-2-1-4 4-3-3 4-4-1-2z"/></svg>',
  shield: '<svg viewBox="0 0 32 32"><path fill="#8fd0e8" stroke="#0d2730" stroke-width="1.5" d="M16 3l11 4c0 10-4 17-11 22C9 24 5 17 5 7z"/></svg>',
  buff: '<svg viewBox="0 0 32 32"><path fill="#9fe58b" stroke="#12300c" stroke-width="1.5" d="M16 3l10 11h-6v6h-8v-6H6zM10 23h12v5H10z"/></svg>',
  debuff: '<svg viewBox="0 0 32 32"><path fill="#c99af0" stroke="#24103a" stroke-width="1.5" d="M16 3c5 7 9 11 9 16a9 9 0 0 1-18 0c0-5 4-9 9-16z"/><circle cx="13" cy="19" r="2" fill="#24103a"/><circle cx="19" cy="19" r="2" fill="#24103a"/></svg>',
  unknown: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#d9cfa8" stroke="#2e2614" stroke-width="1.5"/><text x="16" y="17" font-size="17" text-anchor="middle" dominant-baseline="central" fill="#2e2614" font-family="Black Han Sans">?</text></svg>',
  sleep: '<svg viewBox="0 0 32 32"><text x="8" y="22" font-size="16" fill="#b9c9d9" font-family="Black Han Sans">Z</text><text x="18" y="14" font-size="11" fill="#b9c9d9" font-family="Black Han Sans">z</text></svg>',
  stun: '<svg viewBox="0 0 32 32"><path fill="#f2d36b" stroke="#3a2c06" stroke-width="1.2" d="M16 4l3 8 8 1-6 5 2 9-7-5-7 5 2-9-6-5 8-1z"/></svg>',
  rest: '<svg viewBox="0 0 48 48"><path fill="#e8b65a" d="M24 6c6 8 10 12 10 19a10 10 0 0 1-20 0c0-4 2-7 4-9 0 4 2 6 4 6-2-6 0-12 2-16z"/><path fill="#6b4a2a" d="M8 40l32-6v4L8 44zM40 40L8 34v4l32 6z"/></svg>',
  anvil: '<svg viewBox="0 0 48 48"><path fill="#9aa6a2" d="M6 14h30c0 6 4 8 8 8v4H32l-4 6h6v6H14v-6h6l-4-6H10c-3-2-4-6-4-12z"/></svg>',
};
const TYPE_ART = {
  attack: '<svg viewBox="0 0 40 40"><path fill="rgba(255,235,220,.85)" d="M33 4l3 3-17 17-3-3zM12 20l8 8-2 2-2-1-5 5-3-3 5-5-1-2z"/></svg>',
  skill: '<svg viewBox="0 0 40 40"><path fill="rgba(220,240,250,.85)" d="M20 4l13 5c0 12-5 21-13 27C12 30 7 21 7 9z"/></svg>',
  power: '<svg viewBox="0 0 40 40"><path fill="rgba(255,240,200,.9)" d="M20 3c7 9 11 14 11 21a11 11 0 0 1-22 0c0-5 3-9 5-11 0 5 2 7 5 8-2-7 0-13 1-18z"/></svg>',
  status: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="12" fill="none" stroke="rgba(230,230,230,.7)" stroke-width="3" stroke-dasharray="5 4"/></svg>',
  curse: '<svg viewBox="0 0 40 40"><path fill="rgba(220,180,240,.8)" d="M20 5a12 12 0 0 1 12 12c0 5-3 8-5 9v6h-4v-3h-2v3h-2v-3h-2v3h-4v-6c-2-1-5-4-5-9A12 12 0 0 1 20 5zm-5 10a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm10 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>',
};

/* ---------- game state ---------- */
let G = null;   // run
let B = null;   // battle

/* number formatting for card text (reflects strength, weakness, dexterity, frail) */
function atkVal(base, mult = 1, target = null) {
  if (!B) return base;
  let v = base + B.st.str * mult;
  if (B.st.weak) v *= 0.75;
  if (target && target.st.vuln) v *= 1.5;
  return Math.max(0, Math.floor(v));
}
function blockVal(n) {
  if (!B) return n;
  let v = n + B.st.dex;
  if (B.st.frail) v *= 0.75;
  return Math.max(0, Math.floor(v));
}
function num(v, base) { return `<span class="num ${v > base ? 'plus' : v < base ? 'minus' : ''}">${v}</span>`; }
const D = (base, mult = 1) => num(atkVal(base, mult), base);
const K = n => num(blockVal(n), n);

/* ---------- cards ---------- */
const CARDS = {
  strike: { n: '타격', t: 'attack', r: 'basic', c: 1, tg: 1, d: u => `피해를 ${D(u ? 9 : 6)} 줍니다.`, p: (u, t) => hit(t, u ? 9 : 6) },
  defend: { n: '수비', t: 'skill', r: 'basic', c: 1, d: u => `방어도를 ${K(u ? 8 : 5)} 얻습니다.`, p: u => gainBlock(u ? 8 : 5) },
  bash: { n: '강타', t: 'attack', r: 'basic', c: 2, tg: 1, d: u => `피해를 ${D(u ? 10 : 8)} 줍니다.<br><b>취약</b> ${u ? 3 : 2} 부여.`, p: (u, t) => { hit(t, u ? 10 : 8); debuff(t, 'vuln', u ? 3 : 2); } },

  anger: { n: '분노', t: 'attack', r: 'common', c: 0, tg: 1, d: u => `피해를 ${D(u ? 8 : 6)} 줍니다. 버린 카드 더미에 이 카드를 복사합니다.`, p: (u, t) => { hit(t, u ? 8 : 6); B.discard.push(mk('anger', u)); } },
  cleave: { n: '휩쓸기', t: 'attack', r: 'common', c: 1, d: u => `모든 적에게 피해를 ${D(u ? 11 : 8)} 줍니다.`, p: u => hitAll(u ? 11 : 8) },
  clothesline: { n: '목 걸어 넘기기', t: 'attack', r: 'common', c: 2, tg: 1, d: u => `피해를 ${D(u ? 14 : 12)} 줍니다.<br><b>약화</b> ${u ? 3 : 2} 부여.`, p: (u, t) => { hit(t, u ? 14 : 12); debuff(t, 'weak', u ? 3 : 2); } },
  heavy: { n: '육중한 칼날', t: 'attack', r: 'common', c: 2, tg: 1, d: u => `피해를 ${D(14, u ? 5 : 3)} 줍니다. 힘이 ${u ? 5 : 3}배로 적용됩니다.`, p: (u, t) => hit(t, 14, u ? 5 : 3) },
  ironwave: { n: '강철 파도', t: 'attack', r: 'common', c: 1, tg: 1, d: u => `방어도를 ${K(u ? 7 : 5)} 얻고 피해를 ${D(u ? 7 : 5)} 줍니다.`, p: (u, t) => { gainBlock(u ? 7 : 5); hit(t, u ? 7 : 5); } },
  pommel: { n: '자루 치기', t: 'attack', r: 'common', c: 1, tg: 1, d: u => `피해를 ${D(u ? 10 : 9)} 줍니다. 카드를 ${u ? 2 : 1}장 뽑습니다.`, p: (u, t) => { hit(t, u ? 10 : 9); drawCards(u ? 2 : 1); } },
  twin: { n: '쌍격', t: 'attack', r: 'common', c: 1, tg: 1, d: u => `피해를 ${D(u ? 7 : 5)}씩 2번 줍니다.`, p: (u, t) => { hit(t, u ? 7 : 5); hit(t, u ? 7 : 5); } },
  thunder: { n: '천둥벼락', t: 'attack', r: 'common', c: 1, d: u => `모든 적에게 피해를 ${D(u ? 7 : 4)} 주고 <b>취약</b> 1 부여.`, p: u => { hitAll(u ? 7 : 4); alive().forEach(e => debuff(e, 'vuln', 1)); } },
  bodyslam: { n: '몸통 박치기', t: 'attack', r: 'common', c: 1, cu: 0, tg: 1, d: () => `현재 방어도만큼 피해를 줍니다.${B ? ` (${D(B.block)})` : ''}`, p: (u, t) => hit(t, B.block) },
  boomerang: { n: '부메랑 검', t: 'attack', r: 'common', c: 1, d: u => `무작위 적에게 피해를 ${D(3)}씩 ${u ? 4 : 3}번 줍니다.`, p: u => { for (let i = 0; i < (u ? 4 : 3); i++) { const a = alive(); if (a.length) hit(pick(a), 3); } } },
  wildstrike: { n: '난폭한 일격', t: 'attack', r: 'common', c: 1, tg: 1, d: u => `피해를 ${D(u ? 17 : 12)} 줍니다. 뽑을 카드 더미에 <b>상처</b>를 섞어 넣습니다.`, p: (u, t) => { hit(t, u ? 17 : 12); B.draw.splice(rnd(B.draw.length + 1), 0, mk('wound')); } },
  shrug: { n: '떨쳐내기', t: 'skill', r: 'common', c: 1, d: u => `방어도를 ${K(u ? 11 : 8)} 얻습니다. 카드를 1장 뽑습니다.`, p: u => { gainBlock(u ? 11 : 8); drawCards(1); } },
  flex: { n: '근육 자랑', t: 'skill', r: 'common', c: 0, d: u => `<b>힘</b>을 ${u ? 4 : 2} 얻습니다. 턴이 끝나면 잃습니다.`, p: u => { B.st.str += u ? 4 : 2; B.st.flex += u ? 4 : 2; } },
  truegrit: { n: '투지', t: 'skill', r: 'common', c: 1, d: u => `방어도를 ${K(u ? 9 : 7)} 얻습니다. 손의 무작위 카드 1장을 <b>소멸</b>시킵니다.`, p: u => { gainBlock(u ? 9 : 7); if (B.hand.length) B.exhaust.push(B.hand.splice(rnd(B.hand.length), 1)[0]); } },
  havoc: { n: '파괴', t: 'skill', r: 'common', c: 1, cu: 0, d: () => `뽑을 카드 더미 맨 위의 카드를 사용하고 <b>소멸</b>시킵니다.`, p: () => { reshuffleIfNeeded(); const c = B.draw.pop(); if (c) autoPlay(c); } },

  uppercut: { n: '어퍼컷', t: 'attack', r: 'uncommon', c: 2, tg: 1, d: u => `피해를 ${D(13)} 줍니다.<br><b>약화</b>·<b>취약</b> ${u ? 2 : 1} 부여.`, p: (u, t) => { hit(t, 13); debuff(t, 'weak', u ? 2 : 1); debuff(t, 'vuln', u ? 2 : 1); } },
  carnage: { n: '대학살', t: 'attack', r: 'uncommon', c: 2, tg: 1, eth: 1, d: u => `피해를 ${D(u ? 28 : 20)} 줍니다.`, p: (u, t) => hit(t, u ? 28 : 20) },
  hemo: { n: '피의 일격', t: 'attack', r: 'uncommon', c: 1, tg: 1, d: u => `체력을 2 잃습니다. 피해를 ${D(u ? 20 : 15)} 줍니다.`, p: (u, t) => { loseHp(2); hit(t, u ? 20 : 15); } },
  whirlwind: { n: '회오리', t: 'attack', r: 'uncommon', c: 'X', d: u => `모든 적에게 피해를 ${D(u ? 8 : 5)}씩 X번 줍니다.`, p: (u, t, x) => { for (let i = 0; i < x; i++) hitAll(u ? 8 : 5); } },
  rampage: { n: '광란', t: 'attack', r: 'uncommon', c: 1, tg: 1, d: u => `피해를 ${D(8)} 줍니다. 사용할 때마다 이번 전투에서 피해가 ${u ? 8 : 5} 증가합니다.`, p: (u, t, x, c) => { hit(t, 8 + (c.bonus || 0)); c.bonus = (c.bonus || 0) + (u ? 8 : 5); } },
  dropkick: { n: '날아차기', t: 'attack', r: 'uncommon', c: 1, tg: 1, d: u => `피해를 ${D(u ? 8 : 5)} 줍니다. 대상이 <b>취약</b>이면 에너지 1을 얻고 1장 뽑습니다.`, p: (u, t) => { const v = t.st.vuln; hit(t, u ? 8 : 5); if (v) { B.energy++; drawCards(1); } } },
  bloodletting: { n: '사혈', t: 'skill', r: 'uncommon', c: 0, d: u => `체력을 3 잃고 에너지를 ${u ? 3 : 2} 얻습니다.`, p: u => { loseHp(3); B.energy += u ? 3 : 2; } },
  trance: { n: '전투 무아지경', t: 'skill', r: 'uncommon', c: 0, d: u => `카드를 ${u ? 4 : 3}장 뽑습니다. 이번 턴에는 더 이상 뽑을 수 없습니다.`, p: u => { drawCards(u ? 4 : 3); B.st.noDraw = 1; } },
  disarm: { n: '무장 해제', t: 'skill', r: 'uncommon', c: 1, tg: 1, ex: 1, d: u => `적의 <b>힘</b>을 ${u ? 3 : 2} 낮춥니다.`, p: (u, t) => { t.st.str -= u ? 3 : 2; floatOn(t, `힘 -${u ? 3 : 2}`, 'small'); } },
  intimidate: { n: '위협', t: 'skill', r: 'uncommon', c: 0, ex: 1, d: u => `모든 적에게 <b>약화</b> ${u ? 2 : 1} 부여.`, p: u => alive().forEach(e => debuff(e, 'weak', u ? 2 : 1)) },
  shockwave: { n: '충격파', t: 'skill', r: 'uncommon', c: 2, ex: 1, d: u => `모든 적에게 <b>약화</b>·<b>취약</b> ${u ? 5 : 3} 부여.`, p: u => alive().forEach(e => { debuff(e, 'weak', u ? 5 : 3); debuff(e, 'vuln', u ? 5 : 3); }) },
  ghostly: { n: '유령 갑옷', t: 'skill', r: 'uncommon', c: 1, eth: 1, d: u => `방어도를 ${K(u ? 13 : 10)} 얻습니다.`, p: u => gainBlock(u ? 13 : 10) },
  seeingred: { n: '분노 폭발', t: 'skill', r: 'uncommon', c: 1, cu: 0, ex: 1, d: () => `에너지를 2 얻습니다.`, p: () => { B.energy += 2; } },
  entrench: { n: '참호', t: 'skill', r: 'uncommon', c: 2, cu: 1, d: () => `현재 방어도를 2배로 만듭니다.`, p: () => { const g = B.block; B.block *= 2; if (g) floatOn('p', `+${g}`, 'blockf'); } },
  secondwind: { n: '재기', t: 'skill', r: 'uncommon', c: 1, d: u => `공격이 아닌 손의 카드를 모두 <b>소멸</b>시키고, 1장당 방어도를 ${K(u ? 7 : 5)} 얻습니다.`, p: u => { const keep = [], gone = []; B.hand.forEach(c => (CARDS[c.id].t === 'attack' ? keep : gone).push(c)); B.hand = keep; B.exhaust.push(...gone); gone.forEach(() => gainBlock(u ? 7 : 5)); } },
  inflame: { n: '발화', t: 'power', r: 'uncommon', c: 1, d: u => `<b>힘</b>을 ${u ? 3 : 2} 얻습니다.`, p: u => { B.st.str += u ? 3 : 2; } },
  metallicize: { n: '금속화', t: 'power', r: 'uncommon', c: 1, d: u => `턴이 끝날 때마다 방어도를 ${u ? 4 : 3} 얻습니다.`, p: u => { B.st.metal += u ? 4 : 3; } },
  combust: { n: '연소', t: 'power', r: 'uncommon', c: 1, d: u => `턴이 끝날 때 체력을 1 잃고 모든 적에게 피해를 ${u ? 7 : 5} 줍니다.`, p: u => { B.st.combust += u ? 7 : 5; } },

  bludgeon: { n: '내려찍기', t: 'attack', r: 'rare', c: 3, tg: 1, d: u => `피해를 ${D(u ? 42 : 32)} 줍니다.`, p: (u, t) => hit(t, u ? 42 : 32) },
  feed: { n: '포식', t: 'attack', r: 'rare', c: 1, tg: 1, ex: 1, d: u => `피해를 ${D(u ? 12 : 10)} 줍니다. 처치하면 최대 체력이 ${u ? 4 : 3} 증가합니다.`, p: (u, t) => { if (hit(t, u ? 12 : 10)) { G.maxHp += u ? 4 : 3; G.hp += u ? 4 : 3; floatOn('p', `최대 체력 +${u ? 4 : 3}`, 'heal'); } } },
  immolate: { n: '분신', t: 'attack', r: 'rare', c: 2, d: u => `모든 적에게 피해를 ${D(u ? 28 : 21)} 줍니다. 버린 카드 더미에 <b>화상</b>을 추가합니다.`, p: u => { hitAll(u ? 28 : 21); B.discard.push(mk('burn')); } },
  impervious: { n: '난공불락', t: 'skill', r: 'rare', c: 2, ex: 1, d: u => `방어도를 ${K(u ? 40 : 30)} 얻습니다.`, p: u => gainBlock(u ? 40 : 30) },

/* ---------- map ---------- */
const ROWS = 15, COLS = 7;
const NODE_KO = { M: '적', E: '정', R: '휴', S: '상', '?': '?', T: '보', B: '왕' };
const NODE_NAME = { M: '적', E: '정예', R: '휴식', S: '상점', '?': '미지', T: '보물', B: '보스' };
function genMap() {
  const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  const edges = new Set();
  const ek = (r, a, b) => `${r}:${a}>${b}`;
  let first = -1;
  for (let p = 0; p < 6; p++) {
    let c = rnd(COLS);
    if (p === 1) while (c === first) c = rnd(COLS);
    if (p === 0) first = c;
    for (let r = 0; r < ROWS; r++) {
      grid[r][c] ||= { r, c, type: null, next: [], jx: rnd(15) - 7, jy: rnd(13) - 6 };
      if (r === ROWS - 1) break;
      let nc = clamp(c + rnd(3) - 1, 0, COLS - 1);
      if (nc === c + 1 && edges.has(ek(r, c + 1, c))) nc = c;
      if (nc === c - 1 && edges.has(ek(r, c - 1, c))) nc = c;
      edges.add(ek(r, c, nc));
      if (!grid[r][c].next.includes(nc)) grid[r][c].next.push(nc);
      c = nc;
    }
  }
  const parents = (r, c) => r === 0 ? [] : grid[r - 1].filter(n => n && n.next.includes(c));
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const n = grid[r][c]; if (!n) continue;
    if (r === 0) { n.type = 'M'; continue; }
    if (r === 8) { n.type = 'T'; continue; }
    if (r === ROWS - 1) { n.type = 'R'; continue; }
    for (let tries = 0; tries < 12; tries++) {
      const x = Math.random();
      let t = x < .45 ? 'M' : x < .67 ? '?' : x < .83 ? 'E' : x < .95 ? 'R' : 'S';
      if ((t === 'E' || t === 'R') && r < 5) continue;
      if (t === 'R' && r === ROWS - 2) continue;
      if (['E', 'R', 'S'].includes(t) && parents(r, c).some(p => p.type === t)) continue;
      n.type = t; break;
    }
    n.type ||= 'M';
  }
  return grid;
}

function reachable() {
  if (!G.pos) return G.map[0].filter(Boolean);
  if (G.pos.r === ROWS) return [];
  if (G.pos.r === ROWS - 1) return [{ r: ROWS, c: 3, type: 'B' }];
  return G.map[G.pos.r][G.pos.c].next.map(c => G.map[G.pos.r + 1][c]);
}

function showMap() {
  G.screen = 'map';
  const SX = 80, SY = 74, W = SX * COLS, H = SY * (ROWS + 1) + 70;
  const X = n => SX / 2 + n.c * SX + (n.jx || 0), Y = n => H - 40 - n.r * SY + (n.jy || 0);
  const boss = { r: ROWS, c: 3, jx: 0, jy: -20, type: 'B' };
  const av = reachable();
  const isAv = n => av.some(a => a.r === n.r && a.c === n.c);
  const path = G.path || [];
  const visited = n => path.some(p => p.r === n.r && p.c === n.c);
  let edges = '', nodes = '';
  for (let r = 0; r < ROWS; r++) for (const n of G.map[r]) {
    if (!n) continue;
    const targets = r === ROWS - 1 ? [boss] : n.next.map(c => G.map[r + 1][c]);
    for (const t of targets) {
      const done = visited(n) && visited(t);
      edges += `<line class="edge ${done ? 'done' : ''}" x1="${X(n)}" y1="${Y(n)}" x2="${X(t)}" y2="${Y(t)}"/>`;
    }
  }
  const nodeSvg = (n, rad) => {
    const cls = `node ${n.type === 'E' ? 'E' : ''} ${visited(n) ? 'visited' : ''} ${isAv(n) ? 'avail' : (!visited(n) && G.pos && n.r <= G.pos.r ? 'dim' : '')}`;
    return `<g class="${cls}" data-r="${n.r}" data-c="${n.c}" ${isAv(n) ? 'tabindex="0" role="button"' : ''} aria-label="${n.r + 1}층 ${NODE_NAME[n.type]}"><circle cx="${X(n)}" cy="${Y(n)}" r="${rad}"/><text x="${X(n)}" y="${Y(n)}" ${rad > 20 ? 'style="font-size:26px"' : ''}>${NODE_KO[n.type]}</text></g>`;
  };
  for (let r = 0; r < ROWS; r++) for (const n of G.map[r]) if (n) nodes += nodeSvg(n, 17);
  nodes += nodeSvg(boss, 34);
  setScreen(`<div id="map"><div class="scroll">
    <h2>첨탑 ${G.act}막 · ${ACT_NAME[G.act]}</h2>
    <p style="text-align:center;margin:2px 0 0;font-size:14px">이 막의 보스: <b style="color:#8a1f14">${ENEMIES[G.bossKey[0]].n}</b></p>
    <div class="legend">${Object.keys(NODE_KO).map(k => `<span><i>${NODE_KO[k]}</i>${NODE_NAME[k]}</span>`).join('')}</div>
    <svg id="mapsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="첨탑 지도">${edges}${nodes}</svg>
  </div></div>`);
  const svg = $('#mapsvg');
  svg.querySelectorAll('.node.avail').forEach(g => {
    const go = () => enterNode(+g.dataset.r, +g.dataset.c);
    g.addEventListener('click', go);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  requestAnimationFrame(() => {
    const m = $('#map'); if (!m) return;
    const row = G.pos ? G.pos.r : 0;
    const frac = 1 - (row + 1) / (ROWS + 1);
    m.scrollTop = Math.max(0, m.scrollHeight * frac - m.clientHeight * 0.6);
  });
}

function enterNode(r, c) {
  const n = r === ROWS ? { r, c, type: 'B' } : G.map[r][c];
  G.pos = { r, c };
  (G.path ||= []).push({ r, c });
  G.floor = (G.act - 1) * (ROWS + 1) + r + 1;
  switch (n.type) {
    case 'M': startCombat(pick(r < 3 ? ENC[G.act].easy : ENC[G.act].hard), 'M'); break;
    case 'E': startCombat(pick(ENC[G.act].elite), 'E'); break;
    case 'B': startCombat(G.bossKey, 'B'); break;
    case 'R': showRest(); break;
    case 'S': showShop(); break;
    case 'T': showTreasure(); break;
    case '?': showEvent(); break;
  }
}

/* ---------- combat ---------- */
const alive = () => B.enemies.filter(e => !e.dead);
const unitEl = u => u === 'p' ? document.getElementById('u-p') : document.getElementById('u-' + u.id);

function floatOn(u, text, cls = '') {
  const el = unitEl(u); if (!el) return;
  const r = el.querySelector('.sprite').getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'float ' + cls;
  f.textContent = text;
  f.style.left = (r.left + r.width / 2 + (rnd(30) - 15)) + 'px';
  f.style.top = (r.top + r.height * 0.4 + (rnd(20) - 10)) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 950);
}

function damageEnemy(e, d) {
  if (e.dead) return false;
  let rest = d;
  if (e.block) { const a = Math.min(e.block, rest); e.block -= a; rest -= a; }
  e.hp -= rest;
  B.hits.add(e.id);
  floatOn(e, rest > 0 ? String(rest) : '막음', rest > 0 ? '' : 'blockf');
  if (rest > 0 && e.key === 'laga' && e.asleep > 0) { e.asleep = 0; e.st.metal = 0; e.stunned = 1; e.intent = M('기절', 'stun', e => { e.stunned = 0; }); floatOn(e, '깨어남!', 'small'); }
  if (e.hp <= 0) {
    e.hp = 0; e.dead = true; G.kills++;
    ENEMIES[e.key].onDie?.(e);
    return true;
  }
  ENEMIES[e.key].onHurt?.(e);
  return false;
}

function hit(t, base, mult = 1) {
  if (!t || t.dead) return false;
  let b = base;
  if (has('akabeko') && !B.akaUsed) { b += 8; B.akaUsed = 1; }
  return damageEnemy(t, atkVal(b, mult, t));
}
function hitAll(base) {
  let b = base;
  if (has('akabeko') && !B.akaUsed) { b += 8; B.akaUsed = 1; }
  alive().forEach(e => damageEnemy(e, atkVal(b, 1, e)));
}
function gainBlock(n) { const v = blockVal(n); B.block += v; if (v) floatOn('p', `+${v}`, 'blockf'); }
function enemyBlock(e, n) { e.block += n; floatOn(e, `+${n}`, 'blockf'); }
function debuff(e, k, n) { if (!e || e.dead) return; e.st[k] = (e.st[k] || 0) + n; floatOn(e, `${ST_KO[k]} ${n}`, 'small'); }
function playerDebuff(k, n) { B.st[k] += n; floatOn('p', `${ST_KO[k]} ${n}`, 'small'); }
function addStatus(id, n) { for (let i = 0; i < n; i++) B.discard.push(mk(id)); floatOn('p', `${CARDS[id].n} +${n}`, 'small'); }
function deathCheck() {
  if (G.hp > 0) return;
  const f = G.potions.indexOf('fairy');
  if (f >= 0) { G.potions.splice(f, 1); G.hp = Math.max(1, Math.floor(G.maxHp * 0.3)); floatOn('p', `요정! +${G.hp}`, 'heal'); return; }
  G.hp = 0; B.dying = true;
}
function loseHp(n) { G.hp -= n; B.hits.add('p'); floatOn('p', String(n)); deathCheck(); }
function heal(n) { const before = G.hp; G.hp = Math.min(G.maxHp, G.hp + n); return G.hp - before; }

function damagePlayer(d, attacker) {
  let rest = d;
  if (B.block) { const a = Math.min(B.block, rest); B.block -= a; rest -= a; }
  B.hits.add('p');
  if (rest > 0) { G.hp -= rest; floatOn('p', String(rest)); } else floatOn('p', '막음', 'blockf');
  if (attacker && has('scales')) damageEnemy(attacker, 3);
  deathCheck();
}
function enemyAtk(e, base) {
  let v = base + e.st.str;
  if (e.st.weak) v *= 0.75;
  if (B.st.vuln) v *= 1.5;
  return Math.max(0, Math.floor(v));
}

function reshuffleIfNeeded() {
  if (!B.draw.length && B.discard.length) { B.draw = shuffle(B.discard); B.discard = []; }
}
function drawCards(n) {
  if (B.st.noDraw) return;
  for (let i = 0; i < n; i++) {
    reshuffleIfNeeded();
    if (!B.draw.length) break;
    const c = B.draw.pop();
    if (B.st.confused) c.rcost = rnd(4);
    if (B.hand.length >= 10) B.discard.push(c); else B.hand.push(c);
  }
}
function autoPlay(c) {
  const d = CARDS[c.id];
  if (d.c === 'U' || !d.p) { B.exhaust.push(c); return; }
  const t = d.tg ? pick(alive()) : null;
  if (d.tg && !t) { B.exhaust.push(c); return; }
  d.p(c.up, t, B.energy, c);
  if (d.t === 'skill') onSkill();
  if (d.t !== 'power') B.exhaust.push(c);
}
function onSkill() { alive().forEach(e => { if (e.st.enrage) { e.st.str += e.st.enrage; floatOn(e, `힘 +${e.st.enrage}`, 'small'); } }); }

const ST_KO = { confused: '혼란', str: '힘', dex: '민첩', vuln: '취약', weak: '약화', frail: '손상', metal: '금속화', demon: '악마화', combust: '연소', ritual: '의식', enrage: '격노', flex: '근육', barricade: '바리케이드' };

};
function stsHTML(st, extra = '') {

function intentHTML(e) {

function startCombat(keys, kind) {
  B = {
    kind, enemies: keys.map(k => spawn(k)), draw: shuffle(G.deck.map(c => ({ ...c }))), hand: [], discard: [], exhaust: [],
    energy: 0, block: 0, turn: 0, busy: false, sel: null, hits: new Set(), over: false, dying: false,
    selPot: null, maxE: maxEnergy(),
    st: { confused: 0, str: 0, dex: 0, vuln: 0, weak: 0, frail: 0, metal: 0, demon: 0, combust: 0, flex: 0, noDraw: 0, barricade: 0 },
  };

  if (has('vajra')) B.st.str += 1;
  if (has('stone')) B.enemies.forEach(e => { e.st.str += 1; });

  if (has('vial')) heal(2);
  B.enemies.forEach(e => { e.turn = 1; e.intent = ENEMIES[e.key].ai(e, 1); });

function startTurn() {

function renderCombat() {

    const hp = isP ? G.hp : u.hp, max = isP ? G.maxHp : u.maxHp, blk = isP ? B.block : u.block;
    const id = isP ? 'u-p' : 'u-' + u.id;
    const sz = isP ? '' : (ENEMIES[u.key].sz || '');
    const hitc = B.hits.has(isP ? 'p' : u.id) ? 'hit' : '';
    const lunge = B.lunge === (isP ? 'p' : u.id) ? 'lunge' : '';
    const extra = !isP && u.key === 'laga' && u.asleep > 0 ? `<span class="st good" title="잠: 피해를 받으면 깨어납니다">잠 ${u.asleep}</span>` : '';
    return `<div class="unit ${isP ? 'player' : 'enemy'} ${sz} ${hitc} ${lunge} ${!isP && u.dead ? 'dead' : ''} ${!isP && u.gone ? 'gone' : ''} ${!isP && targeting && !u.dead ? 'targetable' : ''}" id="${id}" ${!isP && !u.dead ? `data-eid="${u.id}" tabindex="${targeting ? 0 : -1}"` : ''} aria-label="${isP ? '철갑 전사' : u.n} 체력 ${hp}">
      ${isP ? '<div class="intent"></div>' : intentHTML(u)}
      <div class="sprite">${SPR[isP ? 'player' : ENEMIES[u.key].spr]}</div>
      <div class="hpbar ${blk ? 'blocked' : ''}"><i style="width:${Math.max(0, hp / max * 100)}%"></i><span>${hp}/${max}</span>${blk ? `<b class="blk">${blk}</b>` : ''}</div>
      <div class="uname">${isP ? '철갑 전사' : u.n}</div>
      <div class="sts">${stsHTML(isP ? B.st : u.st, extra)}</div>
    </div>`;
  };
  field.innerHTML = unit(null, true) + `<div class="enemies">${B.enemies.map(e => unit(e, false)).join('')}</div>` + (targeting ? `<div class="hint">${B.selPot !== null ? `${POTIONS[G.potions[B.selPot]].n}: ` : ''}대상을 선택하세요</div>` : '');
  B.hits.clear(); B.lunge = null;

  const n = B.hand.length;
  const cards = B.hand.map((c, i) => {
    const cost = costOf(c);
    const playable = cost !== 'U' && (cost === 'X' || cost <= B.energy);
    const rot = (i - (n - 1) / 2) * (n > 6 ? 2.5 : 4);
    const lift = Math.abs(i - (n - 1) / 2) ** 2 * (n > 6 ? 1.2 : 2.2);
    const sel = B.sel === i;
    return cardHTML(c, `${playable ? '' : 'cant'} ${sel ? 'sel' : ''}" data-i="${i}" style="transform: ${sel ? 'translateY(-26%) scale(1.08)' : `rotate(${rot}deg) translateY(${lift}px)`}; z-index:${sel ? 30 : i}`);
  }).join('');
  dock.innerHTML = `<div class="left">
      <div class="orb ${B.energy ? '' : 'empty'}" title="에너지">${B.energy}/${B.maxE}</div>
      <button class="pile" id="drawpile" title="뽑을 카드 더미">뽑기 <b>${B.draw.length}</b></button>
    </div>
    <div class="hand" id="hand">${cards}</div>
    <div class="right">
      <button class="btn primary endturn" id="endturn" ${B.busy ? 'disabled' : ''}>턴 종료</button>
      <button class="pile" id="discpile" title="버린 카드 더미">버림 <b>${B.discard.length}</b></button>
      ${B.exhaust.length ? `<button class="pile" id="exhpile" title="소멸된 카드">소멸 <b>${B.exhaust.length}</b></button>` : ''}
    </div>`;
  // overlap cards to fit
  const hand = $('#hand');
  const avail = hand.clientWidth;
  const cw = hand.querySelector('.card')?.offsetWidth || 110;
  if (n > 1) {
    const ov = Math.max(cw * 0.06, (n * cw - (avail - cw * 0.3)) / (n - 1));
    hand.querySelectorAll('.card').forEach((el, i) => { if (i) el.style.marginLeft = `${-ov}px`; });
  }
  hand.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', ev => { ev.stopPropagation(); clickCard(+el.dataset.i); });
    el.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); clickCard(+el.dataset.i); } });
    el.addEventListener('mouseenter', () => { if (B.sel === null && !el.classList.contains('sel')) el.style.transform = 'translateY(-22%) scale(1.06)'; el.style.zIndex = 25; });
    el.addEventListener('mouseleave', () => { renderCardTransform(el); });
  });
  field.querySelectorAll('.enemy.targetable').forEach(el => {
    el.addEventListener('click', ev => { ev.stopPropagation(); const e = B.enemies.find(x => x.id === el.dataset.eid); if (B.selPot !== null) usePotion(B.selPot, e); else playCard(B.sel, e); });
    el.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); el.click(); } });
  });
  $('#endturn').onclick = () => endTurn();
  $('#drawpile').onclick = () => showPile('뽑을 카드 더미 (순서 무작위)', [...B.draw].sort((a, b) => a.id.localeCompare(b.id)));
  $('#discpile').onclick = () => showPile('버린 카드 더미', B.discard);
  if ($('#exhpile')) $('#exhpile').onclick = () => showPile('소멸된 카드', B.exhaust);
  renderBar();
}
function renderCardTransform(el) {
  const i = +el.dataset.i, n = B.hand.length;
  if (B.sel === i) return;
  const rot = (i - (n - 1) / 2) * (n > 6 ? 2.5 : 4);
  const lift = Math.abs(i - (n - 1) / 2) ** 2 * (n > 6 ? 1.2 : 2.2);
  el.style.transform = `rotate(${rot}deg) translateY(${lift}px)`;
  el.style.zIndex = i;
}

function clickCard(i) {
  if (B.busy || B.over) return;
  B.selPot = null;
  if (B.sel === i) { B.sel = null; renderCombat(); return; }
  const c = B.hand[i]; const d = CARDS[c.id]; const cost = costOf(c);
  if (cost === 'U') { toast('이 카드는 사용할 수 없습니다.'); return; }
  if (cost !== 'X' && cost > B.energy) { toast('에너지가 부족합니다.'); return; }
  if (d.tg) {
    const a = alive();
    if (a.length === 1) { playCard(i, a[0]); return; }
    B.sel = i; renderCombat(); return;
  }
  playCard(i, null);
}

function flyCard(i) {
  const el = document.querySelector(`#hand .card[data-i="${i}"]`); if (!el) return;
  const r = el.getBoundingClientRect();
  const g = el.cloneNode(true);
  g.classList.add('ghost'); g.classList.remove('sel');
  Object.assign(g.style, { left: r.left + 'px', top: r.top + 'px', margin: 0, transform: 'none' });
  g.style.setProperty('--dx', `${innerWidth / 2 - r.left - r.width / 2}px`);
  g.style.setProperty('--dy', `${-r.height * 0.9}px`);
  document.body.appendChild(g);
  setTimeout(() => g.remove(), 500);
}

function playCard(i, target) {
  if (B.busy || B.over || i === null || i === undefined) return;
  const c = B.hand[i]; if (!c) return;
  const d = CARDS[c.id]; const cost = costOf(c);
  if (cost === 'U') return;
  if (cost !== 'X' && cost > B.energy) { toast('에너지가 부족합니다.'); return; }
  if (d.tg && (!target || target.dead)) return;
  flyCard(i);
  B.hand.splice(i, 1);
  B.sel = null;
  const x = cost === 'X' ? B.energy : 0;
  B.energy -= cost === 'X' ? B.energy : cost;
  if (d.t === 'attack') B.lunge = 'p';
  d.p(c.up, target, x, c);
  if (d.t === 'skill') onSkill();
  if (d.t !== 'power') (exhausts(c) ? B.exhaust : B.discard).push(c);
  renderCombat();
  checkEnd();
}

function checkEnd() {
  if (B.over) return true;
  if (B.dying || G.hp <= 0) { B.over = true; setTimeout(gameOver, 900); return true; }
  if (!alive().some(e => !e.minion)) { alive().forEach(e => { e.dead = true; }); B.over = true; renderCombat(); setTimeout(winCombat, 800); return true; }
  return false;
}

async function endTurn() {
  if (B.busy || B.over) return;
  B.busy = true; B.sel = null; B.selPot = null; closePotMenu();
  // end-of-turn effects in hand
  for (const c of B.hand) {
    if (c.id === 'burn') damagePlayer(2);
    if (c.id === 'regret') loseHp(B.hand.length);
  }
  if (B.st.metal) gainBlock(B.st.metal);
  if (has('ori') && B.block === 0) { B.block += 6; floatOn('p', '+6', 'blockf'); }
  if (B.st.combust) { loseHp(1); alive().forEach(e => damageEnemy(e, B.st.combust)); }
  if (B.st.flex) { B.st.str -= B.st.flex; B.st.flex = 0; }
  for (const c of B.hand) (CARDS[c.id].eth ? B.exhaust : B.discard).push(c);
  B.hand = [];
  for (const k of ['vuln', 'weak', 'frail']) if (B.st[k]) B.st[k]--;
  renderCombat();
  if (checkEnd()) return;
  await sleep(350);

  for (const e of [...B.enemies]) {
    if (e.dead || B.over) continue;
    if (!e.st.barricade) e.block = 0;
    const m = e.intent;
    if (m.dmg !== undefined) {
      B.lunge = e.id;
      for (let k = 0; k < (m.times || 1); k++) {
        if (G.hp <= 0 || e.dead) break;
        damagePlayer(enemyAtk(e, m.dmg), e);
        renderCombat();
        if (m.times > 1) await sleep(140);
      }
    }
    if (!e.dead) m.fx?.(e);
    if (e.pending === m) e.pending = null;
    e.hist.push(m.nm); e.last = m.nm;
    renderCombat();
    if (checkEnd()) return;
    await sleep(420);
  }
  // end of round for enemies
  for (const e of alive()) {
    if (e.st.ritual) { if (e.fresh) e.fresh = 0; else { e.st.str += e.st.ritual; floatOn(e, `힘 +${e.st.ritual}`, 'small'); } }
    if (e.st.metal && e.asleep > 0) enemyBlock(e, e.st.metal);
    for (const k of ['vuln', 'weak']) if (e.st[k]) e.st[k]--;
    if (e.skipRound) { e.skipRound = 0; continue; }
    e.turn++;
    e.intent = e.pending || ENEMIES[e.key].ai(e, e.turn);
  }
  if (checkEnd()) return;
  startTurn();
}

function winCombat() {
  let healed = 0;
  if (has('burning')) healed += heal(6);
  if (has('blackblood')) healed += heal(12);
  if (has('meat') && G.hp <= G.maxHp / 2) healed += heal(12);
  const kind = B.kind;
  B = null;
  if (kind === 'B') { G.bosses = (G.bosses || 0) + 1; if (G.act >= 2) { victory(); return; } }
  if (kind === 'E') G.elites++;
  let potion = null;
  if (kind === 'B' || rnd(100) < G.potChance + (kind === 'E' ? 10 : 0)) { potion = randomPotion(); G.potChance = Math.max(10, G.potChance - 10); } else G.potChance = Math.min(80, G.potChance + 10);
  if (has('sozu')) potion = null;
  if (kind === 'B') {
    const bossRelics = shuffle(Object.keys(RELICS).filter(k => RELICS[k].boss && !has(k))).slice(0, 3);
    showReward({ gold: rint(95, 105), potion, cards: rollCards(3, 100), bossRelics, healed, boss: true, next: () => startAct(G.act + 1) });
    return;
  }
  const gold = Math.round((kind === 'E' ? rint(25, 35) : rint(10, 20)) * (has('idol') ? 1.25 : 1) * (G.act === 2 ? 1.3 : 1));
  showReward({ gold, potion, relic: kind === 'E' ? randomRelic() : null, cards: rollCards(3, kind === 'E' ? 10 : 3 + (G.act - 1) * 4), healed });
}

function rollCards(n, rareChance) {
  const out = [];
  while (out.length < n) {
    const x = rnd(100);
    const r = x < rareChance ? 'rare' : x < rareChance + 37 ? 'uncommon' : 'common';
    const id = pick(POOL(r));
    if (!out.includes(id)) out.push(id);
  }
  return out.map(id => mk(id));
}

  const rid = randomRelic(); const gold = rint(25, 50);
  setScreen(`<div class="pad"><div class="center">
    <h2>보물 상자</h2>
    <p class="lead">녹슨 자물쇠가 손끝에서 부서진다.</p>
    <div class="rewardlist">
      ${rid ? `<div class="reward">${relicHTML(rid)}<span>${RELICS[rid].n}<small>${RELICS[rid].d}</small></span></div>` : ''}
      <div class="reward"><span style="color:var(--candle)">${IC.coin}</span><span>골드 ${gold}</span></div>
    </div>
    <button class="btn primary" id="take">챙기고 나아가기</button>
  </div></div>`);
  $('#take').onclick = () => { if (rid) giveRelic(rid); addGold(gold); showMap(); };
}

/* ---------- events ---------- */
const EVENTS = [
  { t: '떠돌이 연금술사', d: '부글거리는 솥 앞에서 연금술사가 손을 내민다. "재료가 조금 모자라. 피 몇 방울이면 좋은 걸 만들어 주지."', o: [
    { l: '피를 나눠준다', s: '체력 5 잃음 · 무작위 물약 2개', need: () => G.hp > 5, f: () => { G.hp -= 5; const got = [randomPotion(), randomPotion()].filter(id => addPotion(id)); return got.length ? `${got.map(id => `<b>${POTIONS[id].n}</b>`).join(', ')}을(를) 받았다.` : '물약을 담을 자리가 없어 연금술사가 혀를 찬다.'; } },
    { l: '물약 허리띠를 산다', s: '골드 60 · 물약 슬롯 +2', need: () => G.gold >= 60 && !has('belt'), f: () => { G.gold -= 60; giveRelic('belt'); return '허리띠에 빈 병 걸이가 두 개 더 생겼다.'; } },
    { l: '그냥 지나간다', s: '아무 일도 일어나지 않음', f: () => '솥에서 보라색 연기가 피어오른다.' }] },
  { t: '황금 신상', d: '무너진 제단 위에 사람 머리만 한 황금 신상이 놓여 있다. 받침돌에 연결된 사슬이 천장 어딘가로 이어져 있다.', o: [
    { l: '신상을 챙긴다', s: '골드 +110 · 저주 「부상」을 얻음', f: () => { addGold(110); G.deck.push(mk('injury')); return '신상을 들어 올리는 순간 천장이 무너진다. 겨우 빠져나왔지만 다리를 심하게 다쳤다.'; } },
    { l: '그냥 지나간다', s: '아무 일도 일어나지 않음', f: () => '욕심을 접고 발걸음을 옮긴다.' }] },
  { t: '맑은 샘', d: '돌 틈에서 차가운 물이 솟아오른다. 물 표면에 내 얼굴이 아닌 누군가의 얼굴이 비친다.', o: [
    { l: '물을 마신다', s: () => `체력 ${Math.floor(G.maxHp / 3)} 회복`, f: () => { heal(Math.floor(G.maxHp / 3)); return '몸 깊은 곳까지 시원해진다.'; } },
    { l: '몸을 씻는다', s: '카드 1장 제거', need: () => G.deck.length > 0, f: next => { pickCard('정화할 카드 선택', G.deck, 'remove', c => { G.deck.splice(G.deck.indexOf(c), 1); next(`<b>${cardName(c)}</b>의 기억이 물에 씻겨 나간다.`); }, () => next('망설이다 손을 거둔다.')); return null; } }] },
  { t: '유령 대장장이', d: '모루 앞에서 반투명한 대장장이가 망치를 들고 있다. "피를 조금 나눠주면 무기를 벼려주지."', o: [
    { l: '피를 내어준다', s: '체력 7 잃음 · 무작위 카드 2장 강화', need: () => G.hp > 7, f: () => { G.hp -= 7; const ups = shuffle(G.deck.filter(canUpgrade)).slice(0, 2); ups.forEach(c => { c.up = true; }); return ups.length ? `망치 소리와 함께 ${ups.map(c => `<b>${cardName(c)}</b>`).join(', ')}이(가) 빛난다.` : '강화할 카드가 없어 대장장이가 실망한다.'; } },
    { l: '거절한다', s: '아무 일도 일어나지 않음', f: () => '대장장이는 어깨를 으쓱하고 사라진다.' }] },
  { t: '수상한 상인', d: '그림자 속에서 덩치 큰 상인이 손짓한다. "배고프지 않나? 아니면 건강을 원하나?"', o: [
    { l: '바나나를 먹는다', s: () => `체력 ${Math.floor(G.maxHp / 3)} 회복`, f: () => { heal(Math.floor(G.maxHp / 3)); return '달콤하다.'; } },
    { l: '도넛을 먹는다', s: '최대 체력 +5', f: () => { G.maxHp += 5; G.hp += 5; return '이상하게 힘이 솟는다.'; } },
    { l: '상자를 연다', s: '무작위 유물 · 저주 「후회」를 얻음', f: () => { const r = randomRelic(); if (r) giveRelic(r); G.deck.push(mk('regret')); return r ? `상자 안에서 <b>${RELICS[r].n}</b>을(를) 찾았다. 하지만 뭔가 꺼림칙하다.` : '상자는 비어 있었다. 꺼림칙한 기분만 남는다.'; } }] },
  { t: '매복', d: '통로가 좁아지는 곳에서 낮게 그르렁대는 소리가 들린다. 뭔가가 기다리고 있다.', o: [
    { l: '싸운다', s: '전투 · 승리 시 골드 추가', f: () => { startCombat(pick(ENC[G.act].hard), 'M'); return false; } },
    { l: '조심스레 돌아간다', s: '체력 5 잃음', need: () => G.hp > 5, f: () => { G.hp -= 5; return '날카로운 바위에 긁혔지만 무사히 빠져나왔다.'; } }] },
  { t: '버려진 서재', d: '먼지 쌓인 책장 사이에 세 권의 책이 펼쳐져 있다. 각 페이지에서 희미한 빛이 새어 나온다.', o: [
    { l: '책을 읽는다', s: '카드 3장 중 1장 획득', f: next => { showCardChoice(rollCards(3, 12), c => { if (c) G.deck.push(c); next(c ? `<b>${cardName(c)}</b>의 기술을 익혔다.` : '아무것도 마음에 들지 않았다.'); }); return null; } },
    { l: '잠을 잔다', s: () => `체력 ${Math.floor(G.maxHp / 3)} 회복`, f: () => { heal(Math.floor(G.maxHp / 3)); return '책 냄새 속에서 깊이 잠들었다.'; } }] },
];
function showEvent() {
  G.screen = 'event';
  const ev = pick(EVENTS);
  const result = txt => {
    setScreen(`<div class="pad"><div class="center"><div class="evt"><h2>${ev.t}</h2><p>${txt}</p><button class="btn primary" id="cont">계속</button></div></div></div>`);
    $('#cont').onclick = showMap;
  };
  setScreen(`<div class="pad"><div class="center"><div class="evt">
    <h2>${ev.t}</h2><p>${ev.d}</p>
    ${ev.o.map((o, i) => `<button class="eopt" data-i="${i}" ${o.need && !o.need() ? 'disabled' : ''}>${o.l}<small>${typeof o.s === 'function' ? o.s() : o.s}</small></button>`).join('')}
  </div></div></div>`);
  document.querySelectorAll('.eopt').forEach(b => b.onclick = () => {
    const r = ev.o[+b.dataset.i].f(result);
    if (typeof r === 'string') result(r);
  });
}

/* ---------- overlay ---------- */
function closeOverlay() { $('#overlay').hidden = true; }
$('#ovclose').onclick = () => { closeOverlay(); ovCancel?.(); };
let ovCancel = null;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#overlay').hidden) { closeOverlay(); ovCancel?.(); return; }
  if (!$('#overlay').hidden || !B || G.screen !== 'combat') return;
  if (/^[1-9]$/.test(e.key)) clickCard(+e.key - 1);
  if (e.key === '0') clickCard(9);
  if (e.key.toLowerCase() === 'e') endTurn();
  if (e.key === 'Escape' && B.sel !== null) { B.sel = null; renderCombat(); }
});
function showPile(title, cards) {
  ovCancel = null;
  $('#ovtitle').textContent = `${title} (${cards.length})`;
  $('#ovgrid').className = '';
  $('#ovgrid').innerHTML = cards.length ? cards.map(c => cardHTML(c)).join('') : '<p class="lead">비어 있습니다.</p>';
  $('#ovfoot').innerHTML = '';
  $('#overlay').hidden = false;
}
function pickCard(title, cards, mode, done, cancel) {
  ovCancel = cancel || null;
  $('#ovtitle').textContent = title;
  const grid = $('#ovgrid');
  grid.className = 'pickable';
  grid.innerHTML = cards.map(c => cardHTML(c)).join('');
  $('#ovfoot').innerHTML = '';
  $('#overlay').hidden = false;
  grid.querySelectorAll('.card').forEach(el => {
    const sel = () => {
      const c = cards.find(x => x.uid === +el.dataset.uid);
      const after = mode === 'upgrade' ? { ...c, up: true } : null;
      $('#ovfoot').innerHTML = `<div class="compare">${cardHTML(c)}${after ? `<span class="arrow">→</span>${cardHTML(after)}` : ''}</div>
        <button class="btn primary" id="ovok">${mode === 'upgrade' ? '강화' : '제거'}</button>`;
      $('#ovok').onclick = () => { closeOverlay(); ovCancel = null; done(c); };
      $('#ovok').focus();
    };
    el.onclick = sel; el.onkeydown = e => { if (e.key === 'Enter') sel(); };
  });
}

/* ---------- end screens ---------- */
function statsHTML() {
  return `<dl><dt>도달한 막</dt><dd>${G.act}막</dd><dt>도달한 층</dt><dd>${G.floor}</dd><dt>처치한 적</dt><dd>${G.kills}</dd><dt>쓰러뜨린 정예</dt><dd>${G.elites}</dd><dt>덱 크기</dt><dd>${G.deck.length}장</dd><dt>유물</dt><dd>${G.relics.length}개</dd><dt>골드</dt><dd>${G.gold}</dd></dl>`;
}
function gameOver() {
  B = null; G.screen = 'over';
  setScreen(`<div class="pad"><div class="center end">
    <h2 style="color:var(--blood)">쓰러졌습니다</h2>
    <p class="lead">첨탑은 또 한 명의 도전자를 삼켰다.</p>
    ${statsHTML()}
    <button class="btn primary" id="again">다시 도전</button>
  </div></div>`);
  $('#again').onclick = newRun;
}
function victory() {
  G.screen = 'win';
  setScreen(`<div class="pad"><div class="center end">
    <h2 style="color:var(--candle)">첨탑 정복</h2>
    <p class="lead">${ENEMIES[G.bossKey[0]].n}이(가) 쓰러지고 도시의 종탑이 멈춘다. 철갑 전사는 첨탑의 두 막을 모두 올랐다.</p>
    ${statsHTML()}
    <button class="btn primary" id="again">새로운 등반</button>
  </div></div>`);
  $('#again').onclick = newRun;
}

/* ---------- title ---------- */
function showTitle() {
  G = null; B = null;
  document.body.classList.remove('act2');
  renderBar();
  $('#screen').innerHTML = `<div id="title"><div class="center">
    <svg class="spire-art" viewBox="0 0 200 220" aria-hidden="true">
      <path d="M100 6l14 40h-6l10 34h-6l12 50h-8l16 82H68l16-82h-8l12-50h-6l10-34h-6z" fill="#2b3639" stroke="#3e4c4f" stroke-width="2"/>
      <path d="M100 6l14 40h-6l10 34h-6l12 50h-8l16 82h-32z" fill="#1d2629"/>
      <rect x="95" y="60" width="10" height="12" rx="5" fill="#e8b65a"/><rect x="92" y="110" width="12" height="14" rx="6" fill="#e8b65a" opacity=".8"/><rect x="100" y="160" width="12" height="16" rx="6" fill="#e8b65a" opacity=".6"/>
      <path d="M100 0l4 8h-8z" fill="#cf4b3c"/>
    </svg>
    <span class="sub">덱 빌딩 로그라이크</span>
    <h1>첨탑을 오르는 자</h1>
    <p class="lead">철갑 전사가 되어 지하 묘지와 도시, 두 막으로 이루어진 첨탑을 오르세요. 카드를 모아 덱을 다듬고, 물약을 아껴 쓰고, 적의 의도를 읽어 두 보스를 모두 쓰러뜨리면 승리합니다.</p>
    <button class="btn primary" id="start" style="font-size:22px;padding:12px 34px">등반 시작</button>
    <div class="how">
      <div><b>카드 사용</b>카드를 눌러 사용합니다. 대상이 필요하면 적을 누르세요. 숫자 키 1–9로도 고를 수 있습니다.</div>
      <div><b>에너지와 턴</b>매 턴 에너지 3, 카드 5장. 남은 카드는 턴 종료(E) 때 버려집니다.</div>
      <div><b>적의 의도</b>적 머리 위 아이콘이 다음 행동입니다. 숫자는 받게 될 피해입니다.</div>
      <div><b>방어도</b>내 턴이 시작되면 사라집니다. 적의 공격 직전에 쌓으세요.</div>
      <div><b>물약</b>상단의 병을 눌러 마십니다. 전투 보상과 상점에서 얻고, 최대 3개까지 들고 다닙니다.</div>
    </div>
  </div></div>`;
  $('#start').onclick = newRun;
}

addEventListener('resize', () => { if (B && G?.screen === 'combat') renderCombat(); });
showTitle();
</script>
